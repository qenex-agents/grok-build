# Composio tools for this project, reached through the QENEX agents gRPC
# service xai.grok.tools.v1.GrokToolsService (@composio/grpc).
# Run that server next to the agent. It holds the Composio session and API key.
# A session registers every listed tool while this table is enabled.
# Set enabled = false to skip the dial. A refused connection is remembered
# for 30 seconds so later sessions in the same process do not wait again.
#
#   grok composio list
#   grok composio finalize
#   grok composio execute GITHUB_GET_USER --input '{"login":"octocat"}'
#
# COMPOSIO_GRPC_ADDRESS overrides address.
# COMPOSIO_GRPC_TOKEN is sent as `authorization: Bearer` when the server requires it.
# https://github.com/qenex-agents/composio/tree/next/ts/packages/grpc
[composio_grpc]
address = "127.0.0.1:50051"
enabled = true
